name: Feature request
description: Suggest a change in behaviour or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including doing nothing, or handling it outside the project.
  - type: textarea
    id: scope
    attributes:
      label: Would you be willing to implement it?
      description: A rough yes/no is enough — it affects how the design is discussed.
