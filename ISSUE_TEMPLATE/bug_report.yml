name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fastest reports include a command I can paste.
        Security issues go to digivas.server@gmail.com, not here.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or `git rev-parse --short HEAD`.
      placeholder: v0.1.0 / 2201a1c
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the exact output and exit code.
      render: shell
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest sequence that triggers it.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, shell or runtime version.
      placeholder: Android 16 aarch64, Termux, bash 5.2
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
